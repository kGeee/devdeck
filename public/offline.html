<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DevDeck is not running</title>
    <style>
      /* Standalone: the app's Tailwind build is not available here, so the
         design tokens are inlined to keep the window looking like DevDeck. */
      :root {
        --bg: #0a0a0b;
        --surface: #101012;
        --border: #2d2d34;
        --fg: #e9e9ec;
        --muted: #9a9aa3;
        --muted-2: #6a6a73;
        --accent: #3fb950;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        text-align: center;
      }
      img { width: 56px; height: 56px; border-radius: 14px; }
      h1 { font-size: 16px; font-weight: 600; margin: 18px 0 8px; }
      p { font-size: 13px; line-height: 1.6; color: var(--muted); margin: 0 0 14px; }
      code {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 2px 6px;
        color: var(--fg);
      }
      button {
        margin-top: 6px;
        background: var(--accent);
        color: #05130a;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        border: 0;
        border-radius: 8px;
        padding: 8px 14px;
        cursor: pointer;
      }
      .hint { font-size: 11px; color: var(--muted-2); margin-top: 16px; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>DevDeck isn&rsquo;t running</h1>
      <p>
        This window is installed, but nothing is answering on the local port.
        DevDeck drives processes on your machine, so it needs its own server up.
      </p>
      <p>Start it with <code>npm run start</code> in the DevDeck folder.</p>
      <button onclick="location.reload()">Try again</button>
      <p class="hint">This page is served from the service worker cache.</p>
    </div>
  </body>
</html>
